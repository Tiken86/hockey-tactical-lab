        function parseVideo(url) {
            if (!url || !url.trim()) return null;
            const u = url.trim();
            let m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);

              const [localData, setLocalData] = useState(() => existingTaskData || {
                objective: '', players: '', space: '', rules: '', image: null, linkedAnalysisIds: [],
                adaptMD4: '', adaptMD3: '', progression: '', regression: ''
              });

              // Función para comprimir imágenes
              const compressImage = (file, maxWidth = 1000, quality = 0.6) => {
                return new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                      const canvas = document.createElement('canvas');
                      let width = img.width;
                      let height = img.height;

                      if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                      }

                      canvas.width = width;
                      canvas.height = height;

                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, 0, 0, width, height);

                      const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                      resolve(compressedBase64);
                    };
                    img.src = e.target.result;
                  };
                  reader.readAsDataURL(file);
                });
              };

              const handleImg = async (e) => {
                const file = e.target.files[0];
                if (file) {
                  // Comprimir imagen antes de guardarla
                  try {
                    const compressedImage = await compressImage(file);
                    setLocalData({...localData, image: compressedImage});
                  } catch (error) {
                    console.warn('Error comprimiendo imagen, usando original:', error);
                    // Si falla la compresión, intentar con imagen original
                    try {
                      const reader = new FileReader();
                      reader.onload = (ev) => {
                        // Verificar tamaño antes de guardar
                        const base64 = ev.target.result;
                        if (base64.length > 1000000) { // ~1MB
                          alert('⚠️ La imagen es muy grande. Se recomienda usar una imagen más pequeña para evitar problemas de almacenamiento.');
                        }
                        setLocalData({...localData, image: base64});
                      };
                      reader.readAsDataURL(file);
                    } catch (err) {
                      alert('Error al cargar la imagen. Intenta con una imagen más pequeña.');
                    }
                  }
                }
              };

              const toggleAnalysisLink = (id) => {
                const current = localData.linkedAnalysisIds || [];
                if (current.includes(id)) {
                   setLocalData({...localData, linkedAnalysisIds: current.filter(x => x !== id)});
                } else {
                   setLocalData({...localData, linkedAnalysisIds: [...current, id]});
                }
              };

              return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-6 print:hidden">
                <div className="max-w-6xl mx-auto pb-20">
                  <StatusBadge />
                  <div className="flex items-center gap-4 mb-6">
                    <button onClick={onCancel} className="p-2 hover:bg-slate-200 rounded-full"><ChevronRight className="w-6 h-6 rotate-180" /></button>
                    <div>
                       <div className="flex items-center gap-2">
                           <h2 className="text-xl md:text-2xl font-bold text-slate-800">Diseñando: {taskDef.name}</h2>
                       </div>
                       <p className="text-slate-500 text-xs md:text-sm">{taskDef.desc}</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {/* Columna Izquierda: REFLEXIÓN */}
                    <div className="space-y-6">
                       <div className="bg-blue-50 p-4 md:p-5 rounded-xl shadow-sm border border-blue-200">
                          <h4 className="text-xs font-bold text-blue-800 uppercase mb-3 flex items-center gap-2">
                            <Link className="w-4 h-4" /> Conexión Reflexiva
                          </h4>
                          <p className="text-xs text-blue-700 mb-4 font-medium">
                             ¿Qué problema específico resuelve esta tarea?
                          </p>
                          <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                            {analysis.map((a, i) => {
                              const isSelected = (localData.linkedAnalysisIds || []).includes(a.id);
                              return (
                                <div 
                                  key={i} 
                                  onClick={() => toggleAnalysisLink(a.id)}
                                  className={`cursor-pointer text-xs p-3 rounded-lg border transition-all ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white border-blue-100 text-slate-600 hover:border-blue-300'}`}
                                >
                                  <div className="flex justify-between items-start mb-1">
                                     <span className={`font-bold ${isSelected ? 'text-blue-100' : 'text-slate-800'}`}>{a.situation}</span>
                                     {isSelected && <CheckCircle className="w-3 h-3 text-white" />}
                                  </div>
                                  <p className={`mb-1 ${isSelected ? 'text-white' : 'text-slate-800 font-medium'}`}>{a.problem}</p>
                                </div>
                              );
                            })}
                          </div>
                          {(!localData.linkedAnalysisIds || localData.linkedAnalysisIds.length === 0) && (
                             <div className="mt-3 flex items-center gap-2 text-xs text-red-500 font-bold bg-red-50 p-2 rounded">
                                <AlertTriangle className="w-4 h-4" /> Selecciona al menos un foco.
                             </div>
                          )}
                       </div>
                    </div>

                    {/* Columna Derecha: DISEÑO */}
                    <div className="md:col-span-2 bg-white p-4 md:p-6 rounded-xl shadow-lg border border-slate-200 space-y-5">
                       <div>
                         <label className="font-bold text-sm text-slate-700 block mb-1">Objetivo Didáctico</label>
                         <input className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500" placeholder="Ej: Mejorar la salida de 4..." value={localData.objective} onChange={e => setLocalData({...localData, objective: e.target.value})} />
                       </div>
                       <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                         <div>
                           <label className="font-bold text-sm text-slate-700 block mb-1">Espacio</label>
                           <input className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500" placeholder="Dimensiones..." value={localData.space} onChange={e => setLocalData({...localData, space: e.target.value})} />
                         </div>
                         <div>
                           <label className="font-bold text-sm text-slate-700 block mb-1">Jugadores</label>
                           <input className="w-full p-3 bg-slate-50 border rounded-lg outline-none focus:border-blue-500" placeholder="Ej: 4vs4 + 2C" value={localData.players} onChange={e => setLocalData({...localData, players: e.target.value})} />
                         </div>
                       </div>
                       
                       <div>
                         <label className="font-bold text-sm text-slate-700 block mb-1">Reglas de Provocación / Descripción</label>
                         <textarea className="w-full h-32 p-3 bg-slate-50 border rounded-lg outline-none resize-none focus:border-blue-500" placeholder="Desarrollo de la tarea y reglas..." value={localData.rules} onChange={e => setLocalData({...localData, rules: e.target.value})} />
                       </div>

                       {/* NUEVAS SECCIONES: VARIABILIDAD Y ADAPTABILIDAD */}
                       <div className="border-t border-slate-100 pt-4">
                           <h4 className="text-sm font-black text-slate-800 flex items-center gap-2 mb-4"><Sliders className="w-4 h-4"/> Variabilidad y Adaptabilidad</h4>
                           
                           {/* PROGRESIÓN / REGRESIÓN */}
                           <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                               <div>
                                   <label className="text-xs font-bold text-green-600 block mb-1 flex items-center gap-1"><TrendingUp className="w-3 h-3"/> Progresión (+ Difícil)</label>
                                   <textarea className="w-full h-20 p-3 bg-green-50/50 border border-green-100 rounded-lg text-xs outline-none resize-none focus:border-green-500" placeholder="¿Cómo lo complicamos?" value={localData.progression} onChange={e => setLocalData({...localData, progression: e.target.value})} />
                               </div>
                               <div>
                                   <label className="text-xs font-bold text-orange-600 block mb-1 flex items-center gap-1"><TrendingDown className="w-3 h-3"/> Regresión (Facilitador)</label>
                                   <textarea className="w-full h-20 p-3 bg-orange-50/50 border border-orange-100 rounded-lg text-xs outline-none resize-none focus:border-orange-500" placeholder="¿Cómo lo facilitamos?" value={localData.regression} onChange={e => setLocalData({...localData, regression: e.target.value})} />
                               </div>
                           </div>

                           {/* ADAPTACIÓN A MICROCICLO */}
                           <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <label className="text-xs font-bold text-slate-500 block mb-2 flex items-center gap-1"><Activity className="w-3 h-3"/> Adaptaciones Condicionales</label>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                     <div>
                                         <input className="w-full p-2 bg-white border rounded text-xs" placeholder="Adaptación para MD-4 (Acel/Desacel)..." value={localData.adaptMD4} onChange={e => setLocalData({...localData, adaptMD4: e.target.value})} />
                                     </div>
                                     <div>
                                         <input className="w-full p-2 bg-white border rounded text-xs" placeholder="Adaptación para MD-3 (Sprints)..." value={localData.adaptMD3} onChange={e => setLocalData({...localData, adaptMD3: e.target.value})} />
                                     </div>
                                </div>
                           </div>
                       </div>

                       <div className="border-2 border-dashed border-slate-200 rounded-lg p-4 text-center hover:bg-slate-50 cursor-pointer" onClick={() => imageInputRef.current.click()}>
                          <input type="file" ref={imageInputRef} className="hidden" accept="image/*" onChange={handleImg} />
                          {localData.image ? (
                            <div className="relative h-32">
                               <img src={localData.image} className="h-full mx-auto object-contain" alt="Diagrama" />
                               <button onClick={(e) => { e.stopPropagation(); setLocalData({...localData, image: null}); }} className="absolute top-0 right-0 bg-red-500 text-white p-1 rounded-full"><Trash2 className="w-3 h-3"/></button>
                            </div>
                          ) : (
                            <div className="text-slate-400 text-sm flex flex-col items-center gap-1"><ImageIcon className="w-6 h-6" /><span>Click para subir gráfico/foto pizarra</span></div>
                          )}
                       </div>
                       
                       <button 
                         onClick={() => onSave(localData)} 
                         disabled={!localData.objective || !localData.rules || !localData.linkedAnalysisIds || localData.linkedAnalysisIds.length === 0} 
                         className="w-full bg-slate-900 text-white py-4 rounded-lg font-bold hover:bg-slate-800 disabled:opacity-50 flex items-center justify-center gap-2 text-sm md:text-base sticky bottom-4 shadow-xl"
                       >
                         <Save className="w-4 h-4" /> Finalizar y Guardar Tarea
                       </button>
                    </div>
                  </div>
                </div>
                </div>
              );
        }

        // --- COMPONENTES ---

        function TacticalHackathonApp() {
          // --- ESTADO CON PERSISTENCIA SINCRÓNICA ---
          
          // --- ESTADO DE TRABAJO ---
          const [data, setData] = useState(INITIAL_DATA);
          const [step, setStep] = useState(0);
          const [editingTaskType, setEditingTaskType] = useState(null);

          // --- SESIÓN DE GRUPO (nube) ---
          const [codigo, setCodigo] = useState(null);
          const [entregado, setEntregado] = useState(false);
          const [booting, setBooting] = useState(true);
          const [online, setOnline] = useState(navigator.onLine);
          const [connected, setConnected] = useState(false);
          const [members, setMembers] = useState(1);

          // Estados UI temporales
          const [analysisInput, setAnalysisInput] = useState({ situation: '', role: '', problem: '', cause: '', solution: '', behavior: '' });
          const [editingAnalysisId, setEditingAnalysisId] = useState(null);
          const [newBehavior, setNewBehavior] = useState('');
          const [isAddingBehavior, setIsAddingBehavior] = useState(false);
          const [memberNombre, setMemberNombre] = useState('');
          const [memberApellidos, setMemberApellidos] = useState('');
          const [saveStatus, setSaveStatus] = useState('saved'); // 'saving', 'saved', 'error'

          // Refs para realtime (evitan closures obsoletos en los listeners del canal)
          const channelRef = useRef(null);
          const applyingRemoteRef = useRef(false);   // true mientras aplicamos un cambio recibido (no re-guardar ni re-emitir)
          const saveTimerRef = useRef(null);
          const stepRef = useRef(step);
          const editingTypeRef = useRef(editingTaskType);
          const editingAnalysisRef = useRef(editingAnalysisId);
          useEffect(() => { stepRef.current = step; }, [step]);
          useEffect(() => { editingTypeRef.current = editingTaskType; }, [editingTaskType]);
          useEffect(() => { editingAnalysisRef.current = editingAnalysisId; }, [editingAnalysisId]);

          const readOnly = entregado;  // tras entregar, todo en solo-lectura

          // --- REALTIME: aplicar cambios remotos sin pisar lo que editas ---
          const applyRemote = (updater) => {
            applyingRemoteRef.current = true;
            setData(prev => updater(prev));
          };
          const onScalar = ({ payload }) => {
            if (!payload || payload.sender === SENDER_ID) return;
            applyRemote(prev => ({ ...prev, [payload.field]: payload.value }));
          };
          const onAnalysis = ({ payload }) => {
            if (!payload || payload.sender === SENDER_ID) return;
            applyRemote(prev => {
              let arr = prev.analysis || [];
              if (payload.op === 'delete') {
                arr = arr.filter(x => x.id !== payload.id);
              } else if (payload.item) {
                if (editingAnalysisRef.current === payload.item.id) return prev; // no pisar lo que edito
                arr = arr.some(x => x.id === payload.item.id)
                  ? arr.map(x => x.id === payload.item.id ? payload.item : x)
                  : [...arr, payload.item];
              }
              return { ...prev, analysis: arr };
            });
          };
          const onTask = ({ payload }) => {
            if (!payload || payload.sender === SENDER_ID) return;
            if (stepRef.current === 4 && editingTypeRef.current === payload.type) return; // edito esa tarea: gana lo local
            applyRemote(prev => ({ ...prev, tasks: { ...prev.tasks, [payload.type]: payload.task } }));
          };

          const broadcast = (event, payload) => {
            if (channelRef.current) {
              channelRef.current.send({ type: 'broadcast', event, payload: { ...payload, sender: SENDER_ID } });
            }
          };

          const conectarCanal = (cod) => {
            if (channelRef.current) { sb.removeChannel(channelRef.current); channelRef.current = null; }
            const ch = sb.channel('grupo:' + cod, { config: { broadcast: { self: false }, presence: { key: SENDER_ID } } });
            ch.on('broadcast', { event: 'scalar' }, onScalar)
              .on('broadcast', { event: 'analysis' }, onAnalysis)
              .on('broadcast', { event: 'task' }, onTask)
              .on('broadcast', { event: 'entregado' }, () => setEntregado(true))
              .on('presence', { event: 'sync' }, () => setMembers(Object.keys(ch.presenceState()).length || 1))
              .subscribe((status) => {
                setConnected(status === 'SUBSCRIBED');
                if (status === 'SUBSCRIBED') {
                  ch.track({ at: Date.now() });
                  // Re-sincronizar al conectar: recoge cambios ocurridos entre la carga y la suscripción
                  sb.rpc('cargar_grupo', { p_codigo: cod }).then(({ data: rows }) => {
                    if (rows && rows[0]) {
                      applyingRemoteRef.current = true;
                      setData(rows[0].data && Object.keys(rows[0].data).length ? rows[0].data : INITIAL_DATA);
                      setEntregado(!!rows[0].entregado);
                    }
                  }).catch(() => {});
                }
              });
            channelRef.current = ch;
          };

          // --- CARGA / CREACIÓN / ENTREGA DE GRUPO ---
          const abrirGrupo = async (cod) => {
            const c = (cod || '').trim().toUpperCase();
            if (!c) return false;
            try {
              const { data: rows, error } = await sb.rpc('cargar_grupo', { p_codigo: c });
              if (error) { alert('Error de conexión. Revisa tu internet.'); return false; }
              if (!rows || rows.length === 0) return false; // código inexistente
              const row = rows[0];
              applyingRemoteRef.current = true; // no re-guardar lo recién cargado
              setData(row.data && Object.keys(row.data).length ? row.data : INITIAL_DATA);
              setEntregado(!!row.entregado);
              setCodigo(c);
              try { localStorage.setItem('hockey_lab_codigo_v4', c); } catch (e) {}
              conectarCanal(c);
              const d = row.data && Object.keys(row.data).length ? row.data : INITIAL_DATA;
              setStep(row.entregado ? 5 : (d.momentId ? 2 : 1));
              return true;
            } catch (e) { alert('Error de conexión.'); return false; }
          };

          const crearGrupo = async (nombre, claseCode) => {
            try {
              const { data: cod, error } = await sb.rpc('crear_grupo', { p_nombre: nombre, p_codigo_clase: claseCode });
              if (error) {
                const m = error.message || '';
                if (m.includes('CLASE_INVALIDA')) alert('Código de clase incorrecto. Pídeselo a tu profesor.');
                else if (m.includes('NOMBRE')) alert('Pon un nombre de grupo válido.');
                else alert('No se pudo crear el grupo.');
                return null;
              }
              return cod;
            } catch (e) { alert('Error de conexión.'); return null; }
          };

          const salirGrupo = () => {
            if (channelRef.current) { sb.removeChannel(channelRef.current); channelRef.current = null; }
            try { localStorage.removeItem('hockey_lab_codigo_v4'); localStorage.removeItem('hockey_lab_cache_v4'); } catch (e) {}
            setCodigo(null); setData(INITIAL_DATA); setEntregado(false); setStep(0); setEditingTaskType(null);
          };

          const entregar = async () => {
            if (!window.confirm('¿Entregar el trabajo final? El profesor lo recibirá y ya NO podréis seguir editando.')) return;
            try {
              const { error } = await sb.rpc('entregar_grupo', { p_codigo: codigo });
              if (error) { alert('No se pudo entregar. Inténtalo de nuevo.'); return; }
              setEntregado(true);
              broadcast('entregado', {});
              setStep(5);
            } catch (e) { alert('Error de conexión.'); }
          };

          // --- EFECTOS ---

          // Guardado en la nube (debounce) al cambiar `data`
          useEffect(() => {
            if (!codigo) return;
            if (applyingRemoteRef.current) { applyingRemoteRef.current = false; return; } // venía de remoto: no re-guardar
            setSaveStatus('saving');
            clearTimeout(saveTimerRef.current);
            saveTimerRef.current = setTimeout(async () => {
              try {
                const { error } = await sb.rpc('guardar_grupo', { p_codigo: codigo, p_data: data });
                if (error) {
                  if ((error.message || '').includes('YA_ENTREGADO')) { setEntregado(true); setSaveStatus('saved'); }
                  else setSaveStatus('error');
                } else {
                  setSaveStatus('saved');
                  try { localStorage.setItem('hockey_lab_cache_v4', JSON.stringify(data)); } catch (e) {}
                }
              } catch (e) { setSaveStatus('error'); }
            }, 600);
          }, [data, codigo]);

          // Arranque: reabrir sesión guardada + listeners de conexión
          useEffect(() => {
            // Limpiar restos del modelo antiguo (borradores/estado en localStorage)
            try {
              ['hockey_lab_data_v3', 'hockey_lab_step_v3', 'hockey_lab_editing_type_v3'].forEach(k => localStorage.removeItem(k));
              Object.keys(localStorage).filter(k => k.indexOf('hockey_lab_draft_') === 0).forEach(k => localStorage.removeItem(k));
            } catch (e) {}
            const saved = (() => { try { return localStorage.getItem('hockey_lab_codigo_v4'); } catch (e) { return null; } })();
            if (saved) {
              abrirGrupo(saved).then(ok => { if (!ok) { try { localStorage.removeItem('hockey_lab_codigo_v4'); } catch (e) {} } setBooting(false); });
            } else {
              setBooting(false);
            }
            const goOnline = () => setOnline(true);
            const goOffline = () => setOnline(false);
            window.addEventListener('online', goOnline);
            window.addEventListener('offline', goOffline);
            return () => {
              window.removeEventListener('online', goOnline);
              window.removeEventListener('offline', goOffline);
              if (channelRef.current) sb.removeChannel(channelRef.current);
            };
          }, []);

          // --- HELPERS ---

          const SCALAR_FIELDS = ['groupName', 'momentId', 'videoUrl', 'customBehaviors', 'members'];
          const updateData = (field, value) => {
            if (readOnly) return;
            setData(prev => ({ ...prev, [field]: value }));
            if (SCALAR_FIELDS.includes(field)) broadcast('scalar', { field, value });
          };
          const selectedMoment = GAME_MOMENTS.find(m => m.id === data.momentId) || GAME_MOMENTS[0];
          
          const isOffensive = selectedMoment.id === 'MPP' || selectedMoment.id === 'MTF';
          const roleOptions = isOffensive ? ROLES['OFENSIVOS (Con Bola)'] : ROLES['DEFENSIVOS (Sin Bola)'];

          const availableBehaviors = [...selectedMoment.behaviors, ...data.customBehaviors];

          const handleAddCustomBehavior = () => {
            if (newBehavior.trim()) {
              updateData('customBehaviors', [...data.customBehaviors, newBehavior.trim()]);
              setAnalysisInput({...analysisInput, behavior: newBehavior.trim()});
              setNewBehavior('');
              setIsAddingBehavior(false);
            }
          };

          const addMember = () => {
            if (readOnly) return;
            const nombre = memberNombre.trim();
            const apellidos = memberApellidos.trim();
            if (!nombre) return;
            updateData('members', [...(data.members || []), { id: Date.now(), nombre, apellidos }]);
            setMemberNombre('');
            setMemberApellidos('');
          };

          const removeMember = (id) => {
            if (readOnly) return;
            updateData('members', (data.members || []).filter(m => m.id !== id));
          };

          const addAnalysisItem = () => {
            if (readOnly) return;
            if (analysisInput.problem && analysisInput.cause && analysisInput.solution) {
              if (editingAnalysisId) {
                const item = { ...analysisInput, id: editingAnalysisId };
                updateData('analysis', data.analysis.map(it => it.id === editingAnalysisId ? item : it));
                setEditingAnalysisId(null);
                broadcast('analysis', { op: 'upsert', item });
              } else {
                const item = { ...analysisInput, id: Date.now() };
                updateData('analysis', [...data.analysis, item]);
                broadcast('analysis', { op: 'upsert', item });
              }
              setAnalysisInput({ situation: '', role: '', problem: '', cause: '', solution: '', behavior: '' });
            }
          };

          const editAnalysisItem = (item) => {
            setAnalysisInput(item);
            setEditingAnalysisId(item.id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const cancelEdit = () => {
            setAnalysisInput({ situation: '', role: '', problem: '', cause: '', solution: '', behavior: '' });
            setEditingAnalysisId(null);
          };

          const removeAnalysisItem = (id) => {
            if (readOnly) return;
            updateData('analysis', data.analysis.filter(item => item.id !== id));
            broadcast('analysis', { op: 'delete', id });
            if (editingAnalysisId === id) cancelEdit();
          };

          const saveTask = (taskData) => {
            if (readOnly) { setStep(3); setEditingTaskType(null); return; }
            const type = editingTaskType;
            setData(prev => ({
              ...prev,
              tasks: { ...prev.tasks, [type]: taskData }
            }));
            broadcast('task', { type, task: taskData });
            try { localStorage.removeItem(`hockey_lab_draft_${type}_v3`); } catch (e) {}
            setStep(3);
            setEditingTaskType(null);
          };

          const exportProject = () => {
            const dataStr = JSON.stringify(data, null, 2);
            const link = document.createElement('a');
            link.download = `tactical-lab-${data.groupName.replace(/\s+/g, '-').toLowerCase() || 'proyecto'}.json`;
            link.href = URL.createObjectURL(new Blob([dataStr], { type: "application/json" }));
            link.click();
          };

          // --- COMPONENTES DE UI COMUNES ---
          
          const StatusBadge = () => {
            const badge = saveStatus === 'saving'
              ? <><RefreshCw className="w-3 h-3 animate-spin text-blue-500" /> Guardando…</>
              : saveStatus === 'error'
              ? <><AlertTriangle className="w-3 h-3 text-red-500" /> Sin guardar</>
              : <><Cloud className="w-3 h-3 text-green-500" /> Guardado</>;
            return (
              <>
                <div className="fixed top-4 right-4 z-50 flex items-center gap-2 print:hidden">
                  <div className="bg-white/90 backdrop-blur shadow-sm border border-slate-200 rounded-full px-3 py-1 text-xs font-medium flex items-center gap-2">
                    {badge}
                  </div>
                  {codigo && (
                    <div className="bg-white/90 backdrop-blur shadow-sm border border-slate-200 rounded-full px-3 py-1 text-xs font-bold flex items-center gap-2" title="Código de grupo">
                      <Link className="w-3 h-3 text-slate-500" /> {codigo}
                      {members > 1 && <span className="text-blue-600">· {members} online</span>}
                    </div>
                  )}
                </div>
                {codigo && !online && (
                  <div className="fixed inset-0 z-[100] bg-slate-900/85 backdrop-blur flex items-center justify-center p-6 text-center print:hidden">
                    <div className="max-w-sm">
                      <RefreshCw className="w-10 h-10 text-lime-400 animate-spin mx-auto mb-4" />
                      <h3 className="text-xl font-bold text-white mb-2">Sin conexión</h3>
                      <p className="text-slate-300 text-sm">Esta herramienta necesita internet para trabajar en grupo. Reconectando automáticamente…</p>
                    </div>
                  </div>
                )}
              </>
            );
          };

          // --- VISTAS ---

          // PANTALLA DE CARGA INICIAL
          if (booting) return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center gap-4">
              <RefreshCw className="w-10 h-10 text-lime-400 animate-spin" />
              <p className="text-slate-400 text-sm">Cargando…</p>
            </div>
          );

          // PANTALLA DE ACCESO (crear / abrir grupo)
          if (!codigo) return <AccessScreen onCrear={crearGrupo} onAbrir={abrirGrupo} />;

                   {(() => {
                      const v = parseVideo(data.videoUrl || selectedMoment.video);
                      if (!v) return <p className="text-slate-400 text-sm">Aún no hay vídeo. Pegad el enlace que os tocó analizar.</p>;

                        <Microscope className="w-5 h-5 md:w-6 md:h-6 text-blue-600" />

                               <option key={i} value={`${s.label} [${s.type}]`}>{s.label}</option>
                            ))}
                         </select>
                      </div>
                      
                      <div>
                         <label className="text-xs font-bold text-slate-500 uppercase block mb-2">B. Rol del Jugador Clave</label>
                         <select 
                            className="w-full p-3 bg-white border rounded-lg text-sm focus:border-blue-500 outline-none"
                            value={analysisInput.role}
                            onChange={(e) => setAnalysisInput({...analysisInput, role: e.target.value})}
                         >
                            <option value="">-- Seleccionar --</option>
                            {roleOptions.map((r, i) => (
                               <option key={i} value={r}>{r}</option>
                            ))}
                         </select>
                      </div>
                   </div>

                   <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-4">

                            onChange={(e) => setAnalysisInput({...analysisInput, problem: e.target.value})}

                      </div>
                      <div>
                         <label className="text-xs font-bold text-slate-500 uppercase block mb-1">2. Causa Táctica (Why?)</label>

              </div>
            </div>

          // 3. DASHBOARD

                <StatusBadge />
                <div className="max-w-5xl mx-auto">
                  <div className="flex justify-between items-center mb-4">
                     {entregado
                       ? <span className="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1"><CheckCircle className="w-4 h-4" /> ENTREGADO (solo lectura)</span>
                       : <span></span>}
                     <button onClick={salirGrupo} className="text-slate-400 hover:text-slate-700 text-xs flex items-center gap-1"><RotateCcw className="w-3 h-3" /> Salir del grupo</button>
                  </div>
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">

                       <h2 className="text-2xl md:text-3xl font-black text-slate-800">Planning de Sesión</h2>
                       <p className="text-slate-500 text-sm md:text-base">Diseñad las 4 tareas basándoos en vuestro análisis previo.</p>

                     <div className="text-left md:text-right w-full md:w-auto bg-white p-3 rounded-lg md:bg-transparent md:p-0">

                    <div className="flex flex-wrap gap-2">

                          {!readOnly && <button onClick={() => removeMember(m.id)} className="text-slate-400 hover:text-red-500" title="Quitar">✕</button>}

                  </div>
                </div>
              </div>

          if (step === 4 && editingTaskType) {

              <TaskEditor
                editingTaskType={editingTaskType}
                existingTaskData={data.tasks[editingTaskType]}
                analysis={data.analysis}
                onSave={saveTask}
                onCancel={() => { setEditingTaskType(null); setStep(3); }}

                <div className="max-w-6xl mx-auto">

                            <h1 className="text-4xl font-black text-slate-900 mb-2">{data.groupName}</h1>
                            <p className="text-xl text-slate-500">Propuesta de Intervención Táctica</p>
                            {(data.members || []).length > 0 && (
                              <p className="text-sm text-slate-600 mt-3 max-w-xl">
                                <span className="font-bold uppercase text-xs text-slate-400">Integrantes: </span>
                                {(data.members || []).map(m => `${m.nombre} ${m.apellidos}`.trim()).join(' · ')}
                              </p>
                            )}
                         </div>
                         <div className="text-right">
                            <span className={`px-4 py-2 rounded-lg ${selectedMoment.color} text-white font-bold`}>{selectedMoment.id}</span>
                            <p className="text-sm text-slate-400 mt-1">{new Date().toLocaleDateString()}</p>

                      </div>
                      
                      {(() => {

                             <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm mb-4 border-b pb-2">Vídeo analizado</h3>

                                {v.thumb && <img src={v.thumb} alt="Miniatura del vídeo" className="w-48 rounded-lg border border-slate-200 flex-shrink-0" />}
                                <span className="text-blue-600 underline text-sm break-all">{v.url}</span>
                             </a>
                           </div>
                         );
                      })()}

                      <div className="mb-8">

                          <thead className="bg-slate-50 text-slate-500 font-bold uppercase">
                            <tr>
                              <th className="p-3">Contexto</th>
                              <th className="p-3">Problema / Causa</th>
                              <th className="p-3">Solución Táctica</th>
                              <th className="p-3">Comportamiento</th>
                            </tr>
                          </thead>
                          <tbody>
                            {data.analysis.map((a) => (
                              <tr key={a.id} className="border-b border-slate-100">
                                <td className="p-3">
                                   <div className="font-bold text-slate-800">{a.situation}</div>

                                   <div className="text-slate-800 mb-1">{a.problem}</div>
                                   <div className="text-xs text-slate-500 italic">"{a.cause}"</div>

                                <td className="p-3 text-green-700 font-bold">{a.solution}</td>
                                <td className="p-3"><span className="bg-slate-100 px-2 py-1 rounded text-xs">{a.behavior}</span></td>

                      const task = data.tasks[type];
                      if (!task) return null;
                      const linkedAnalysis = data.analysis.filter(a => (task.linkedAnalysisIds || []).includes(a.id));

                      return (
                         <div key={type} className="print-page-break print-container bg-white border-2 border-slate-100 rounded-xl overflow-hidden mb-6">
                            <div className="bg-slate-50 p-4 border-b border-slate-100 flex justify-between items-center">
                               <div>
                                 <span className="font-black text-2xl text-slate-800 uppercase block">{TASK_DEFINITIONS[type].name}</span>
                                 <span className="text-xs text-slate-500">{TASK_DEFINITIONS[type].desc}</span>
                               </div>
                               <span className="text-sm font-bold px-4 py-2 rounded bg-slate-100 text-slate-600">
                                  Ficha Técnica
                               </span>
                            </div>
                            <div className="p-8 flex flex-col h-full">
                               {/* CONEXIÓN */}
                               <div className="mb-6 bg-blue-50 p-3 rounded border border-blue-100">
                                  <span className="font-bold text-blue-800 text-xs block mb-1 uppercase tracking-wider">Problemas a Resolver</span>
                                  <ul className="list-disc pl-4 text-blue-700 text-sm">
                                     {linkedAnalysis.map((a, i) => (
                                       <li key={i}><strong>{a.situation}:</strong> {a.solution}</li>
                                     ))}
                                  </ul>
                               </div>

                               <div className="flex flex-row gap-8 h-full">
                                   <div className="flex-1 flex flex-col gap-6">
                                      <div>
                                        <span className="text-xs font-bold text-slate-400 block uppercase tracking-wider mb-1">Objetivo Didáctico</span>
                                        <p className="text-lg font-medium text-slate-800">{task.objective}</p>
                                      </div>
                                      <div className="grid grid-cols-2 gap-4">
                                         <div className="bg-slate-50 p-3 rounded">
                                           <span className="text-xs font-bold text-slate-400 block uppercase">Espacio</span>
                                           <p className="text-base font-bold">{task.space}</p>
                                         </div>
                                         <div className="bg-slate-50 p-3 rounded">
                                           <span className="text-xs font-bold text-slate-400 block uppercase">Jugadores</span>
                                           <p className="text-base font-bold">{task.players}</p>
                                         </div>
                                      </div>
                                      <div className="flex-grow">
                                         <span className="text-xs font-bold text-slate-400 block uppercase tracking-wider mb-2">Reglas y Descripción</span>
                                         <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">{task.rules}</p>
                                      </div>
                                   </div>
                                   
                                   <div className="w-1/3 flex flex-col gap-4">
                                      <div className="aspect-video bg-slate-100 rounded-lg border border-slate-200 flex items-center justify-center overflow-hidden">
                                         {task.image ? (
                                           <img src={task.image} className="w-full h-full object-contain" alt="Gráfico Tarea" />
                                         ) : (
                                           <div className="text-slate-400 text-center p-4"><ImageIcon className="w-12 h-12 mx-auto mb-2"/><p className="text-xs">Sin Gráfico</p></div>
                                         )}
                                      </div>

                                      <div className="border-t border-slate-100 pt-4 space-y-3">
                                          <div><span className="text-xs font-bold text-green-600 block uppercase">Progresión (+)</span><p className="text-xs text-slate-600">{task.progression || '-'}</p></div>
                                          <div><span className="text-xs font-bold text-orange-600 block uppercase">Regresión (-)</span><p className="text-xs text-slate-600">{task.regression || '-'}</p></div>
                                      </div>
                                      <div className="bg-slate-50 p-3 rounded text-xs border border-slate-100">
                                          <span className="font-bold text-slate-500 block mb-1">Adaptaciones Carga</span>
                                          <p className="mb-1"><span className="font-bold text-purple-700">MD-4 (Acel/Desacel):</span> <br/>{task.adaptMD4 || '-'}</p>
                                          <p><span className="font-bold text-orange-700">MD-3 (Sprints/HSR):</span> <br/>{task.adaptMD3 || '-'}</p>
                                      </div>
                                   </div>
                               </div>
                            </div>
                         </div>
                      );
                   })}
                </div>
              </div>
            );
          }
          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(TacticalHackathonApp));
    </script>
</body>
</html>
