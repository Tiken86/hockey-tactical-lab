<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hockey Tactical Lab — Panel del Profesor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const SUPABASE_URL = 'https://hucsouzfffhqlrogyxwn.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y3NvdXpmZmZocWxyb2d5eHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDYwNDksImV4cCI6MjA5NjUyMjA0OX0.UPGfdAk8gBclAwhBv4wiXUw5kBRVfhqx7l4emAMrgbQ';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        const MOMENTOS = {
          MPP: 'Momento Posesión-Posición',
          MTF: 'Transición-Finalización',
          MRO: 'Recuperación Organizada',
          MRC: 'Recuperación Circunstancial'
        };
        const TAREAS = {
          DIRIGIDA: 'Tarea Dirigida', ESTRUCTURADA: 'Tarea Estructurada',
          ESPECIAL: 'Tarea Especial', COMPETITIVA: 'Tarea Competitiva'
        };

        const fmtFecha = (s) => s ? new Date(s).toLocaleString('es-ES') : '—';

        function Modal({ grupo, onClose }) {
          const d = grupo.data || {};
          const analysis = d.analysis || [];
          const tasks = d.tasks || {};
          const descargarJSON = () => {
            const link = document.createElement('a');
            link.download = `entrega-${grupo.nombre_grupo.replace(/\s+/g, '-').toLowerCase()}-${grupo.codigo}.json`;
            link.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
            link.click();
          };
          return (
            <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-start justify-center overflow-y-auto p-4 no-print">
              <div className="bg-white rounded-xl max-w-4xl w-full my-8 shadow-2xl">
                <div className="flex justify-between items-center p-5 border-b border-slate-100 sticky top-0 bg-white rounded-t-xl">
                  <div>
                    <h2 className="text-xl font-black text-slate-800">{grupo.nombre_grupo}</h2>
                    <p className="text-xs text-slate-500">Código {grupo.codigo} · {MOMENTOS[d.momentId] || 'Sin momento'} · {grupo.entregado ? 'ENTREGADO ' + fmtFecha(grupo.entregado_at) : 'Borrador'}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={descargarJSON} className="bg-green-600 text-white px-3 py-2 rounded-lg font-bold text-sm">Descargar JSON</button>
                    <button onClick={() => window.print()} className="bg-slate-800 text-white px-3 py-2 rounded-lg font-bold text-sm">Imprimir</button>
                    <button onClick={onClose} className="text-slate-500 px-3 py-2 text-sm">Cerrar</button>
                  </div>
                </div>
                <div className="p-6 space-y-8 print:p-0">
                  <div>
                    <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm mb-3 border-b pb-2">Análisis Táctico ({analysis.length})</h3>
                    {analysis.length === 0 ? <p className="text-slate-400 text-sm">Sin análisis.</p> : (
                      <div className="space-y-3">
                        {analysis.map((a, i) => (
                          <div key={i} className="border border-slate-200 rounded-lg p-3 text-sm">
                            <div className="flex flex-wrap gap-2 mb-2">
                              <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">{a.situation}</span>
                              <span className="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded">{a.role}</span>
                            </div>
                            <p><span className="font-bold text-red-500">Problema:</span> {a.problem}</p>
                            <p><span className="font-bold text-slate-400">Causa:</span> <i>{a.cause}</i></p>
                            <p><span className="font-bold text-green-600">Solución:</span> {a.solution}</p>
                            {a.behavior && <p><span className="font-bold text-slate-400">Comportamiento:</span> {a.behavior}</p>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div>
                    <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm mb-3 border-b pb-2">Tareas Diseñadas</h3>
                    <div className="space-y-4">
                      {Object.keys(TAREAS).map((k) => {
                        const t = tasks[k];
                        if (!t) return <p key={k} className="text-slate-400 text-sm">{TAREAS[k]}: <i>no diseñada</i></p>;
                        return (
                          <div key={k} className="border border-slate-200 rounded-lg p-4">
                            <h4 className="font-black text-slate-800 uppercase text-sm mb-2">{TAREAS[k]}</h4>
                            <p className="text-sm"><b>Objetivo:</b> {t.objective}</p>
                            <p className="text-sm"><b>Espacio:</b> {t.space} · <b>Jugadores:</b> {t.players}</p>
                            <p className="text-sm whitespace-pre-wrap"><b>Reglas:</b> {t.rules}</p>
                            {(t.progression || t.regression) && <p className="text-sm"><b>Progresión:</b> {t.progression || '—'} · <b>Regresión:</b> {t.regression || '—'}</p>}
                            {(t.adaptMD4 || t.adaptMD3) && <p className="text-sm"><b>MD-4:</b> {t.adaptMD4 || '—'} · <b>MD-3:</b> {t.adaptMD3 || '—'}</p>}
                            {t.image && <img src={t.image} alt="gráfico" className="mt-2 max-h-48 rounded border" />}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function Panel() {
          const [clave, setClave] = useState('');
          const [auth, setAuth] = useState(false);
          const [grupos, setGrupos] = useState([]);
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');
          const [verGrupo, setVerGrupo] = useState(null);

          const entrar = async () => {
            setError('');
            if (!clave) { setError('Escribe la clave.'); return; }
            setLoading(true);
            const { data, error } = await sb.rpc('profesor_listar', { p_clave: clave });
            setLoading(false);
            if (error) { setError((error.message || '').includes('CLAVE_INVALIDA') ? 'Clave incorrecta.' : 'Error de conexión.'); return; }
            setGrupos(data || []);
            setAuth(true);
          };
          const refrescar = async () => {
            setLoading(true);
            const { data, error } = await sb.rpc('profesor_listar', { p_clave: clave });
            setLoading(false);
            if (!error) setGrupos(data || []);
          };
          const ver = async (codigo) => {
            setLoading(true);
            const { data, error } = await sb.rpc('profesor_obtener', { p_clave: clave, p_codigo: codigo });
            setLoading(false);
            if (error || !data || !data.length) { setError('No se pudo abrir la entrega.'); return; }
            setVerGrupo(data[0]);
          };

          if (!auth) {
            return (
              <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
                <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 max-w-sm w-full space-y-5">
                  <div className="text-center">
                    <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-lime-400 to-green-500">PANEL DEL PROFESOR</h1>
                    <p className="text-slate-400 text-sm mt-1">Hockey Tactical Lab</p>
                  </div>
                  <input type="password" placeholder="Clave de profesor"
                    className="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white focus:border-lime-500 outline-none"
                    value={clave} onChange={(e) => setClave(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && entrar()} />
                  <button disabled={loading} onClick={entrar} className="w-full bg-lime-500 hover:bg-lime-400 disabled:opacity-50 text-slate-900 font-bold py-3 rounded-lg">
                    {loading ? 'Comprobando…' : 'Entrar'}
                  </button>
                  {error && <p className="text-red-400 text-sm text-center">{error}</p>}
                </div>
              </div>
            );
          }

          const entregados = grupos.filter(g => g.entregado).length;
          return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-8">
              <div className="max-w-5xl mx-auto">
                <div className="flex flex-wrap justify-between items-center mb-6 gap-3 no-print">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-black text-slate-800">Entregas del Seminario</h1>
                    <p className="text-slate-500 text-sm">{grupos.length} grupos · {entregados} entregados</p>
                  </div>
                  <button onClick={refrescar} className="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-sm">{loading ? 'Cargando…' : 'Refrescar'}</button>
                </div>
                {error && <p className="text-red-500 text-sm mb-3">{error}</p>}
                <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
                  <table className="w-full text-sm text-left">
                    <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-xs">
                      <tr>
                        <th className="p-3">Grupo</th>
                        <th className="p-3">Código</th>
                        <th className="p-3">Estado</th>
                        <th className="p-3">Última edición</th>
                        <th className="p-3"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {grupos.length === 0 && (
                        <tr><td colSpan="5" className="p-6 text-center text-slate-400">Aún no hay grupos.</td></tr>
                      )}
                      {grupos.map((g) => (
                        <tr key={g.codigo} className="border-t border-slate-100 hover:bg-slate-50">
                          <td className="p-3 font-bold text-slate-800">{g.nombre_grupo}</td>
                          <td className="p-3 font-mono text-slate-600">{g.codigo}</td>
                          <td className="p-3">
                            {g.entregado
                              ? <span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">Entregado</span>
                              : <span className="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-1 rounded-full">Borrador</span>}
                          </td>
                          <td className="p-3 text-slate-500 text-xs">{fmtFecha(g.updated_at)}</td>
                          <td className="p-3 text-right">
                            <button onClick={() => ver(g.codigo)} className="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold text-xs">Ver</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {verGrupo && <Modal grupo={verGrupo} onClose={() => setVerGrupo(null)} />}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Panel />);
    </script>
</body>
</html>
